
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Financeiro</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Meu Financeiro</h1>
        <p>Controle seus gastos de forma simples.</p>
    </header>

    <main>

        <!-- Resumo financeiro -->
        <section class="resumo">

            <h2>Saldo disponível</h2>
            <h3>R$ 0,00</h3>

            <div class="valores">
                <p>Entradas: R$ 0,00</p>
                <p>Saídas: R$ 0,00</p>
            </div>

        </section>

        <!-- Botões de entrada e saída -->
        <section class="acoes">

            <button class="botao-entrada" id="btnEntrada" type="button">
                + Adicionar entrada
            </button>

            <button class="botao-saida" id="btnSaida" type="button">
                - Adicionar saída
            </button>

        </section>

        <!-- Formulário de movimentação -->
        <section class="formulario" id="formulario">

            <h2 id="tituloFormulario">Nova movimentação</h2>

            <form id="formMovimentacao">

                <label for="descricao" class="form-label">Descrição</label>

                <input
                    type="text"
                    id="descricao" class="form-control"
                    placeholder="Ex: Salário, mercado..."
                    required
                >

                <label for="valor" class="form-label">Valor (R$)</label>

                <input
                    type="number"
                    id="valor" class="form-control"
                    min="0.01"
                    step="0.01"
                    placeholder="Ex: 150,00"
                    required
                >

                <label for="categoria" class="form-label">Categoria</label>

                <select id="categoria" class="form-select" required>

                    <option value="">Selecione uma categoria</option>
                    <option value="Salário">Salário</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Moradia">Moradia</option>
                    <option value="Outros">Outros</option>

                </select>

                <div class="botoes-formulario">

                    <button type="submit" id="btnSalvar" class="btn btn-success">
                        Salvar
                    </button>

                    <button type="button" id="btnCancelar" class="btn btn-outline-secondary">
                        Cancelar
                    </button>

                </div>

            </form>

        </section>

        <section class="card mb-4" aria-labelledby="tituloGastos">
            <div class="card-body">
                <h2 id="tituloGastos" class="h5">Gastos por categoria</h2>
                <div id="graficoGastos" aria-live="polite">
                    <p class="text-body-secondary mb-0">Nenhuma saída registrada.</p>
                </div>
            </div>
        </section>

        <!-- Histórico de movimentações -->
        <section class="historico">

            <h2>Transações recentes</h2>

            <div id="listaMovimentacoes">

                <p class="mensagem-vazia">
                    Nenhuma movimentação cadastrada.
                </p>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
